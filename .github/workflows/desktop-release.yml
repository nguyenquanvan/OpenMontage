name: Desktop release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version expected from lib/app_version.py (example: 1.6.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mosa-tool-all-macos
          - os: windows-latest
            artifact: mosa-tool-all-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-packaging.txt

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(python -c 'from lib.app_version import APP_VERSION; print(APP_VERSION)')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${VERSION}" >&2
            exit 1
          fi
          if [[ -n "${{ inputs.confirm_version }}" && "${{ inputs.confirm_version }}" != "${VERSION}" ]]; then
            echo "Requested version ${{ inputs.confirm_version }} does not match ${VERSION}" >&2
            exit 1
          fi

      - name: Build desktop app
        run: python scripts/build_desktop.py

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "MOSA TOOL ALL" -srcfolder "dist/MOSA TOOL ALL.app" -ov -format UDZO "dist/MOSA-TOOL-ALL-macOS.dmg"

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/MOSA TOOL ALL" -DestinationPath "dist/MOSA-TOOL-ALL-Windows.zip" -Force

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "from lib.app_version import APP_VERSION; print(APP_VERSION)"
          $build = python -c "from lib.app_version import APP_BUILD; print(APP_BUILD)"
          $source = (Resolve-Path "dist/MOSA TOOL ALL").Path
          $output = (Resolve-Path "dist").Path
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$version" "/DAppBuild=$build" "/DSourceDir=$source" "/DOutputDir=$output" "packaging/windows-installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "from lib.app_version import APP_VERSION; print(APP_VERSION)"
          $build = python -c "from lib.app_version import APP_BUILD; print(APP_BUILD)"
          $installer = Get-ChildItem "dist/MOSA-TOOL-ALL-Setup-*-win-x64.exe" | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\MOSA TOOL ALL\MOSA TOOL ALL.exe"
          if (-not (Test-Path $app)) { throw "Installed executable not found: $app" }
          $cli = Start-Process -FilePath $app -ArgumentList "--help" -Wait -PassThru
          if ($cli.ExitCode -ne 0) { throw "Installed MOSA executable failed CLI startup with exit code $($cli.ExitCode)" }
          $installRoot = Split-Path $app
          $runtimeRoot = Join-Path $installRoot "_internal\runtime"
          $checks = @(
            (Join-Path $runtimeRoot "node\node.exe"),
            (Join-Path $runtimeRoot "ffmpeg\ffmpeg.exe"),
            (Join-Path $runtimeRoot "ffmpeg\ffprobe.exe"),
            (Join-Path $runtimeRoot "uv\uv.exe"),
            (Join-Path $installRoot "_internal\remotion-composer\node_modules")
          )
          foreach ($path in $checks) {
            if (-not (Test-Path $path)) { throw "Bundled runtime path missing: $path" }
          }
          & (Join-Path $runtimeRoot "node\node.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node.js failed" }
          & (Join-Path $runtimeRoot "ffmpeg\ffmpeg.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed" }
          & (Join-Path $runtimeRoot "ffmpeg\ffprobe.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffprobe failed" }
          & (Join-Path $runtimeRoot "uv\uv.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled uv failed" }
          $env:OPENMONTAGE_DATA_DIR = Join-Path $env:RUNNER_TEMP "mosa-tool-all-smoke"
          $port = 4762
          $server = Start-Process -FilePath $app -ArgumentList "--server-only", "--port", "$port" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/version" -TimeoutSec 2
                if ($response.version -eq $version -and $response.build -eq $build) {
                  $ready = $true
                  break
                }
              } catch {
                if ($server.HasExited) {
                  throw "Installed MOSA server exited with code $($server.ExitCode): $($_.Exception.Message)"
                }
              }
            }
            if (-not $ready) { throw "Installed MOSA server did not answer /api/version" }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*-Setup-*.exe
            dist/*.zip
            dist/MOSA-TOOL-ALL-version.json
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: mosa-tool-all-macos
          path: release/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mosa-tool-all-windows
          path: release/windows

      - name: Collect release files
        run: |
          mkdir -p release/assets
          cp release/macos/*.dmg release/assets/
          cp release/windows/*-Setup-*.exe release/assets/
          cp release/windows/*.zip release/assets/
          cp release/windows/MOSA-TOOL-ALL-version.json release/assets/

      - name: Generate SHA-256 manifest
        working-directory: release/assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/assets/*
          generate_release_notes: true
